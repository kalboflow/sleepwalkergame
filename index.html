<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sleepwalker</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial;
    }

    canvas {
      background: #000;
      border: 2px solid #333;
    }
  </style>
</head>

<body>

<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// PLAYER (sleepwalker)
let player = {
  x: 400,
  y: 300,
  w: 18,
  h: 28,
  speed: 3
};

let keys = {};
let currentRoom = 1;

const door = {
  x: 710,
  y: 250,
  width: 30,
  height: 100
};
window.addEventListener("keydown", (e) => keys[e.key] = true);
window.addEventListener("keyup", (e) => keys[e.key] = false);

// UPDATE
function update() {
  if (keys["ArrowUp"]) player.y -= player.speed;
  if (keys["ArrowDown"]) player.y += player.speed;
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;

  // sienos
  player.x = Math.max(60, Math.min(740 - player.w, player.x));
  player.y = Math.max(60, Math.min(540 - player.h, player.y));
}

// DRAW
function draw() {
  // background
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // kambarys
  ctx.fillStyle = "#0c0c0c";
  ctx.fillRect(60, 60, 680, 480);

  // grindų „grid“
  ctx.strokeStyle = "#111";
  for (let x = 60; x < 740; x += 20) {
    ctx.beginPath();
    ctx.moveTo(x, 60);
    ctx.lineTo(x, 540);
    ctx.stroke();
  }
  for (let y = 60; y < 540; y += 20) {
    ctx.beginPath();
    ctx.moveTo(60, y);
    ctx.lineTo(740, y);
    ctx.stroke();
  }

  // sienos
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 4;
  ctx.strokeRect(60, 60, 680, 480);

  // PLAYER (sleepwalker žmogus)
  ctx.fillStyle = "white";

  // galva
  ctx.beginPath();
  ctx.arc(player.x + 9, player.y + 8, 6, 0, Math.PI * 2);
  ctx.fill();

  // kūnas
  ctx.fillRect(player.x + 7, player.y + 14, 4, 10);

  // kojos
  ctx.beginPath();
  ctx.moveTo(player.x + 7, player.y + 24);
  ctx.lineTo(player.x + 3, player.y + 32);
  ctx.moveTo(player.x + 11, player.y + 24);
  ctx.lineTo(player.x + 15, player.y + 32);
  ctx.strokeStyle = "white";
  ctx.stroke();
}

// LOOP
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
